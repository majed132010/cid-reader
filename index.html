  .report-table tr:last-child { border-bottom: none; }
  .report-table th {
    background: #f4f4f2; color: #666; font-weight: 500;
    font-size: 13px; padding: 10px 14px; text-align: right;

  .report-table input, .report-table textarea {
    width: 100%; background: transparent; border: none; outline: none;
    font-size: 14px; color: #1a1a18; font-family: inherit;

    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px;
  }

    flex: 1; padding: 13px; background: #25D366; color: #fff;

    font-size: 14px; font-weight: 600; cursor: pointer;

    white-space: nowrap; z-index: 999; font-family: inherit;
    max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; }
</style>

<script>
const PROXY_URL = 'https://hidden-base-56d1.majed132010.workers.dev';
const VISION_KEY = 'AIzaSyCeAppQZsqt4HBT1ZM4eO2JS4qLYIx31Z4';
const GROQ_MODEL = 'llama-3.3-70b-versatile';

let b64 = null, imageEl = null, gpsLat = null, gpsLng = null, selectedType = '';

const btnScan       = document.getElementById('btnScan');
const loading       = document.getElementById('loading');
const loadingStep   = document.getElementById('loadingStep');
const resultSection = document.getElementById('resultSection');
const filenameBadge = document.getElementById('filenameBadge');
const previewBox    = document.getElementById('previewBox');
const previewImg    = document.getElementById('previewImg');
const previewSize   = document.getElementById('previewSize');

function selectType(val, btn) {
  selectedType = val;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('customTypeRow').style.display = val === 'other' ? 'block' : 'none';
  if (val !== 'other') document.getElementById('customType').value = '';
}

function getCaseType() {
  if (selectedType === 'other') return document.getElementById('customType').value.trim() || 'أخرى';
  return selectedType;
}

function updateCallBtn(phone) {
  const btn = document.getElementById('callBtn');
  const clean = phone.trim();
  btn.href = 'tel:' + clean;
  btn.style.display = clean ? 'inline-flex' : 'none';
}

function formatBytes(bytes) {
  const k = 1024;
  const sizes = ['B', 'KB', 'MB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;

  filenameBadge.textContent = '✓ ' + file.name;
  filenameBadge.style.display = 'block';

  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    previewImg.src = dataUrl;
    previewBox.style.display = 'block';

    // ضغط الصورة
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const maxSize = 1200;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      b64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
      const sz = Math.round((b64.length * 3) / 4);
      previewSize.textContent = 'بعد الضغط: ' + formatBytes(sz);
      btnScan.style.display = 'flex';
    };
    img.onerror = () => { b64 = dataUrl.split(',')[1]; btnScan.style.display = 'flex'; };
    img.src = dataUrl;
    resultSection.style.display = 'none';
    gpsLat = null; gpsLng = null;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function cleanSummary(text) {
  if (!text) return '';
  const skipWords = [
    'جنسية', 'Biometric', 'biometric', 'الموقع الظاهر',
    'خط العرض', 'خط الطول', 'http', 'تم إنشاء البلاغ',
    'منصة CID', 'مشغل', 'محافظة جدة', 'الاسم -',
    'عائشة المسعري', 'تم ترحيل'
  ];
  const lines = text.split('\n');
  const filtered = lines.filter(line => {
    const trimmed = line.trim();
    if (!trimmed) return false;
    return !skipWords.some(w => trimmed.includes(w));
  });
  return filtered.join('\n').trim();
}

function dmsToDecimal(str) {
  if (!str) return null;
  str = str.toString().trim();
  if (/^\d+\.\d+$/.test(str)) return parseFloat(str);
  const parts = str.split(':');
  if (parts.length === 3) {
    const d = parseFloat(parts[0]);
    const m = parseFloat(parts[1]);
    const s = parseFloat(parts[2]);
    return d + m/60 + s/3600;
  }
  return parseFloat(str) || null;
}

btnScan.addEventListener('click', async () => {
  if (!b64) return;
  btnScan.style.display = 'none';
  loading.style.display = 'block';

  try {
    if (!b64) throw new Error('لم يتم اختيار صورة');

    // الخطوة 1: Google Vision عبر الـ Worker
    loadingStep.textContent = 'جاري قراءة النص من الصورة...';
    const visionRes = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service: 'vision',
        payload: {
          requests: [{
            image: { content: b64 },
            features: [{ type: 'TEXT_DETECTION', maxResults: 1 }]
          }]
        }
      })
    });
    const visionData = await visionRes.json();
    if (visionData.error) throw new Error(visionData.error.message);
    const ocrText = visionData.responses?.[0]?.fullTextAnnotation?.text || '';
    if (!ocrText) throw new Error('لم يتم قراءة أي نص من الصورة');
    b64 = null;

    // الخطوة 2: Groq يصيغ المعلومات من النص
    loadingStep.textContent = 'جاري استخراج المعلومات...';
    const prompt = `النص التالي مستخرج من نظام بلاغات CID. استخرج هذه الحقول وأجب بـ JSON فقط:
{"name":"","phone":"","location":"","lat":"","lng":"","summary":""}
- name: الاسم
- phone: رقم الهاتف بصيغة 05XXXXXXXX
- location: التقاطعات (اسم الشوارع فقط، بدون روابط)
- lat: خط العرض من LL( إن وجد (رقم عشري مثل 21.56)
- lng: خط الطول من LL( إن وجد (رقم عشري مثل 39.12)
- summary: وصف الحادث والمركبة ولوحتها فقط. احذف: جنسية/Biometric/روابط/CID/موقع ظاهر
JSON فقط.

النص:
${ocrText.substring(0, 3000)}`;

    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service: 'groq',
        payload: {
          model: GROQ_MODEL,
          messages: [{ role: 'user', content: prompt }],
          max_tokens: 400,
          temperature: 0
        }
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    let raw = data.choices?.[0]?.message?.content || '';
    raw = raw.trim().replace(/```json|```/g, '').trim();
    const json = JSON.parse(raw);

    document.getElementById('fName').value     = json.name     || '';
    document.getElementById('fPhone').value    = json.phone    || '';
    document.getElementById('fLocation').value = json.location || '';
    document.getElementById('fSummary').value  = cleanSummary(json.summary || '');
    updateCallBtn(json.phone || '');

    const locText = json.location || '';
    if (json.lat && json.lng) {
      gpsLat = dmsToDecimal(json.lat);
      gpsLng = dmsToDecimal(json.lng);
      if (gpsLat > 30) { const tmp = gpsLat; gpsLat = gpsLng; gpsLng = tmp; }
      document.getElementById('mapLink').href = `https://www.google.com/maps?q=${gpsLat},${gpsLng}`;
      document.getElementById('mapLinkRow').style.display = 'block';
    } else if (locText) {
      document.getElementById('mapLink').href = `https://www.google.com/maps/search/${encodeURIComponent(locText + ' جدة')}`;
      document.getElementById('mapLinkRow').style.display = 'block';
    } else {
      document.getElementById('mapLinkRow').style.display = 'none';
    }

    resultSection.style.display = 'block';
    resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (err) {
    const msg = err.message || JSON.stringify(err);
    showToast('خطأ: ' + msg.substring(0, 80));
    console.error('Full error:', err);
    btnScan.style.display = 'flex';
  } finally {
    loading.style.display = 'none';
  }
});

function buildMsg() {
  const patrol   = document.getElementById('patrolCode').value.trim() || '—';
  const caseType = getCaseType();
  const name     = document.getElementById('fName').value.trim()      || '—';
  const phone    = document.getElementById('fPhone').value.trim()     || '—';
  const location = document.getElementById('fLocation').value.trim()  || '—';
  const summary  = document.getElementById('fSummary').value.trim()   || '—';
  const mapLine  = (gpsLat && gpsLng) ? `\n🗺️ https://www.google.com/maps?q=${gpsLat},${gpsLng}` : '';
  const line     = '➖➖➖➖➖➖➖➖➖➖';

  return (
    `${line}\n` +
    `🚔 *الدورية:* ${patrol}\n` +
    (caseType ? `📌 *النوع:* ${caseType}\n` : '') +
    `${line}\n` +
    `👤 *الاسم:* ${name}\n` +
    `📱 *الجوال:* ${phone}\n` +
    `📍 *الموقع:* ${location}${mapLine}\n` +
    `${line}\n` +
    `📝 *الحالة:*\n${summary}\n` +
    `${line}\n` +
    `⚠️ *تنبيه:* الموقع يمثل آخر نقطة اتصال المخبر. لا يُعتمد عليها`
  );
}

function copyMsg() {
  navigator.clipboard.writeText(buildMsg())
    .then(() => showToast('✓ تم النسخ'))
    .catch(() => showToast('تعذّر النسخ'));
}

function sendWa() {
  window.open('https://wa.me/?text=' + encodeURIComponent(buildMsg()), '_blank');
}

function resetAll() {
  b64 = null; imageEl = null; gpsLat = null; gpsLng = null; selectedType = '';
  previewImg.src = '';
  previewBox.style.display = 'none';
  previewSize.textContent = '';
  filenameBadge.style.display = 'none';
  btnScan.style.display = 'none';
  resultSection.style.display = 'none';
  loading.style.display = 'none';
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('customType').value = '';
  document.getElementById('customTypeRow').style.display = 'none';
  document.getElementById('mapLinkRow').style.display = 'none';
  document.getElementById('callBtn').style.display = 'none';
  ['fName','fPhone','fLocation','fSummary'].forEach(id => document.getElementById(id).value = '');
  showToast('جاهز لبلاغ جديد');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
